name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="QDock-v${VERSION}-mac-universal.dmg"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="true"
            NPM_TAG="next"
          else
            PRERELEASE="false"
            NPM_TAG="latest"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: ./scripts/build_universal_app.sh "${{ steps.meta.outputs.version }}"

      - name: Create DMG
        run: ./scripts/create_dmg.sh "${{ steps.meta.outputs.version }}"

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 "${{ steps.meta.outputs.dmg_name }}" > checksums.txt

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/${{ steps.meta.outputs.dmg_name }}
            dist/checksums.txt

      # In-app one-click updates fetch the installer from npm. Publishing uses
      # npm trusted publishing (OIDC), so no long-lived npm token exists. A
      # failed publish (e.g. a misconfigured trusted publisher on npmjs.com)
      # must not block the GitHub release; rerun this job after fixing it.
      - name: Publish installer to npm
        continue-on-error: true
        run: |
          # Trusted publishing needs npm 11.5.1+; Node 20 bundles npm 10.
          npm install -g npm@11.21.0
          cd installer
          npm version --no-git-tag-version "${{ steps.meta.outputs.version }}"
          if [[ "${{ steps.meta.outputs.npm_tag }}" == "latest" ]]; then
            npm publish --provenance --access public
          else
            npm publish --provenance --access public --tag "${{ steps.meta.outputs.npm_tag }}"
          fi
